---
# Headless Service: exists to give the StatefulSet stable per-pod DNS
# (spec.serviceName). It deliberately advertises NO ports: probes target
# container ports on the pod directly, tsidp serves on its tailnet
# interface via tsnet, and the operator metrics endpoint (:8081) is not
# published — scrape the pod directly (e.g. a PodMonitor), ideally behind
# a NetworkPolicy.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tsidp.fullname" . }}
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "tsidp.selectorLabels" . | nindent 4 }}
