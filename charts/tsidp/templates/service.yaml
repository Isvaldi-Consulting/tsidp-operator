# Headless Service required by the StatefulSet (serviceName). tsidp itself
# serves on its tailnet interface via tsnet, not on the pod IP, so the only
# No ports are advertised: probes hit the pod IP directly, and the
# operator metrics endpoint (:8081) is deliberately not published — scrape
# the pod directly (PodMonitor) if needed, ideally behind a NetworkPolicy.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tsidp.fullname" . }}
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "tsidp.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
