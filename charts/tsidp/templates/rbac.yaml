{{- if .Values.rbac.create }}
{{- /*
Two modes:
  - operator.watchNamespaces empty (default): ClusterRole/ClusterRoleBinding.
    NOTE the honest blast radius: RBAC cannot be label-scoped, so this grants
    read/write on EVERY Secret in the cluster (the operator's label selector
    narrows only its informer cache). Anyone who can run code as, exec into,
    or attach ephemeral containers to the operator pod — or create a pod
    using its ServiceAccount — inherits that.
  - operator.watchNamespaces set: namespaced Role/RoleBinding per listed
    namespace; the operator is started with --watch-namespaces and needs no
    cluster-wide Secret access at all.
*/}}
{{- if .Values.operator.watchNamespaces }}
{{- range .Values.operator.watchNamespaces }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString .)) }}
{{- fail (printf "operator.watchNamespaces entry %q is not a valid namespace name" (toString .)) }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tsidp.fullname" $ }}
  namespace: {{ . | quote }}
  labels:
    {{- include "tsidp.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["tsidp.isvaldi-consulting.github.io"]
    resources: ["oidcclients"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["tsidp.isvaldi-consulting.github.io"]
    resources: ["oidcclients/status"]
    verbs: ["get", "update"]
  - apiGroups: ["tsidp.isvaldi-consulting.github.io"]
    resources: ["oidcclients/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tsidp.fullname" $ }}
  namespace: {{ . | quote }}
  labels:
    {{- include "tsidp.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tsidp.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tsidp.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tsidp.fullname" . }}
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tsidp.isvaldi-consulting.github.io"]
    resources: ["oidcclients"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["tsidp.isvaldi-consulting.github.io"]
    resources: ["oidcclients/status"]
    verbs: ["get", "update"]
  - apiGroups: ["tsidp.isvaldi-consulting.github.io"]
    resources: ["oidcclients/finalizers"]
    verbs: ["update"]
  # Cluster-wide Secrets read/write — see the mode note above. Use
  # operator.watchNamespaces for a least-privilege install.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tsidp.fullname" . }}
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tsidp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tsidp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
