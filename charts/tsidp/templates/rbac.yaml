{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tsidp.fullname" . }}
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
rules:
  # The operator reconciles OIDCClient resources in all namespaces.
  - apiGroups:
      - tsidp.isvaldi-consulting.github.io
    resources:
      - oidcclients
      - oidcclients/status
      - oidcclients/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Client credentials are materialized into Secrets.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tsidp.fullname" . }}
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tsidp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tsidp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
