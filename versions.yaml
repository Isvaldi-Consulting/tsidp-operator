# tsidp-operator <-> tsidp compatibility matrix.
#
# Machine-updated by hack/sync-tsidp-version.sh (invoked via
# `make sync-tsidp-version`; there is deliberately no CI job that writes
# this file). Newest row first.
#
# Schema:
#   compatibility:
#     - operator: "<operator version — appVersion in charts/tsidp/Chart.yaml>"
#       tsidp:    "<tsidp image tag pinned in hack/tsidp.Dockerfile>"
#       tested:   "<UTC date YYYY-MM-DD the pair last passed hack/e2e.sh,
#                  or a note such as pending-first-e2e>"
#
# Promise: the chart's default tsidp.image.tag (the `# tsidp-version-pin`
# line in charts/tsidp/values.yaml) always equals the tsidp tag of the newest
# e2e-tested row here. See docs/COMPATIBILITY.md.
compatibility:
  - operator: "v0.1.1"
    tsidp: "v0.0.15"
    tested: "2026-09-20"
  - operator: "v0.1.0"
    tsidp: "v0.0.15"
    tested: "2026-09-19"
