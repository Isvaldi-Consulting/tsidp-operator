name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GitHub release
  packages: write # ghcr.io image + Helm OCI chart

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The chart is packaged AS COMMITTED — no --version/--app-version
      # overrides — so Chart.yaml must already carry the versions this tag
      # claims to release. Convention: appVersion keeps the "v" prefix (it is
      # the operator image tag, and images are pushed as :<git tag>), the
      # chart version drops it. This forces maintainers to bump Chart.yaml
      # in-repo before tagging, keeping the released chart, image, and
      # versions.yaml rows in lockstep.
      - name: Verify Chart.yaml versions match the tag
        run: |
          ok=true
          if ! grep -q "^appVersion: \"${GITHUB_REF_NAME}\"$" charts/tsidp/Chart.yaml; then
            echo "::error file=charts/tsidp/Chart.yaml::appVersion must be \"${GITHUB_REF_NAME}\" (with the v prefix) before tagging ${GITHUB_REF_NAME}. Found: $(grep '^appVersion:' charts/tsidp/Chart.yaml)"
            ok=false
          fi
          if ! grep -q "^version: ${GITHUB_REF_NAME#v}$" charts/tsidp/Chart.yaml; then
            echo "::error file=charts/tsidp/Chart.yaml::version must be ${GITHUB_REF_NAME#v} (v-less) before tagging ${GITHUB_REF_NAME}. Found: $(grep '^version:' charts/tsidp/Chart.yaml)"
            ok=false
          fi
          $ok

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/isvaldi-consulting/tsidp-operator:${{ github.ref_name }}
            ghcr.io/isvaldi-consulting/tsidp-operator:latest

      - uses: azure/setup-helm@v4

      - name: Package and push Helm chart (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Packaged as committed: the "Verify Chart.yaml versions" step above
          # already guaranteed version/appVersion in Chart.yaml match this tag.
          helm package charts/tsidp --destination dist/
          helm push "dist/tsidp-${VERSION}.tgz" oci://ghcr.io/isvaldi-consulting/charts

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
