# The tsidp <-> operator compatibility testing loop.
#
# How the whole loop fits together (see docs/COMPATIBILITY.md for prose):
#
#   hack/tsidp.Dockerfile pins the tsidp release under test.
#   Dependabot (docker ecosystem, /hack) bumps that pin -> the e2e job spins
#   up kind, installs the chart with the bumped tsidp image + a freshly built
#   operator image, and runs hack/e2e.sh's assertions against a real tailnet.
#
# The workflow deliberately runs on EVERY pull request (no `paths:` filter)
# so that "e2e" can be a required status check without deadlocking normal
# PRs: a path-filtered workflow that never triggers reports NO check at all
# (which blocks merging forever — not the same as a "skipped" conclusion).
# Instead the e2e job itself diffs against the base branch:
#   - hack/tsidp.Dockerfile unchanged  -> fast success (required check green);
#   - pin changed, TS_AUTHKEY present  -> full kind + tailnet e2e;
#   - pin changed, TS_AUTHKEY missing  -> HARD FAIL (an untested tsidp bump
#     must never be mergeable just because credentials were absent).
#
# Merge flow for Dependabot bumps (make "e2e" a required status check):
#   1. Dependabot opens the PR bumping hack/tsidp.Dockerfile.
#   2. e2e must pass (requires TS_AUTHKEY configured as a *Dependabot* secret
#      in addition to an Actions secret — Dependabot-triggered runs read from
#      the Dependabot secret store).
#   3. On merge, a maintainer runs `make sync-tsidp-version` (or triggers this
#      workflow via workflow_dispatch) to propagate the tag into
#      charts/tsidp/values.yaml and versions.yaml via `make sync-tsidp-version`.
#
# Honesty note about automation limits: workflows triggered by Dependabot run
# with a read-only GITHUB_TOKEN, and PRs opened *by* GITHUB_TOKEN do not
# trigger other workflows. So we do not try to auto-commit the values.yaml /
# versions.yaml sync onto Dependabot's PR — a maintainer runs
# `FORCE_TESTED_DATE=1 make sync-tsidp-version` after merge instead.

name: tsidp compatibility

on:
  pull_request:
  schedule:
    # Weekly canary: re-test the pinned pair every Monday 06:00 UTC even with
    # no code changes (catches registry/image regressions and bit-rot).
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      tsidp_tag:
        description: >-
          Optional tsidp image tag to test instead of the pin in
          hack/tsidp.Dockerfile (e.g. v0.0.16). If e2e passes, a maintainer edits hack/tsidp.Dockerfile to the new tag and runs `make sync-tsidp-version`, which
          updates the chart pin and versions.yaml.
        required: false
        type: string

permissions:
  contents: read

jobs:
  # secrets.* is not available in job-level `if:` expressions, so a tiny gate
  # job exports "is TS_AUTHKEY configured?" as an output that e2e can key on.
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - name: Check for TS_AUTHKEY
        id: check
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -n "$TS_AUTHKEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TS_AUTHKEY secret not available; skipping real e2e, contract-test is the fallback."
          fi

  # THE REAL LOOP: kind + real tsidp (pinned or overridden tag) + operator
  # sidecar + sample OIDCClient lifecycle assertions. All cluster logic lives
  # in hack/e2e.sh; this job only installs prerequisites and calls `make e2e`.
  #
  # Designed to be a REQUIRED status check: it runs on every PR, but the
  # expensive part is gated by the "Decide whether e2e must run" step —
  # PRs that leave hack/tsidp.Dockerfile untouched succeed in seconds, and
  # a pin-bump PR without TS_AUTHKEY fails loudly instead of skipping.
  e2e:
    needs: check-secret
    # Always run on PRs (the in-job gate decides what happens); scheduled and
    # manual runs still skip cleanly when no TS_AUTHKEY is configured.
    if: github.event_name == 'pull_request' || needs.check-secret.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the gate step can diff against the PR base ref.
          fetch-depth: 0
      - name: Decide whether e2e must run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HAS_KEY: ${{ needs.check-secret.outputs.has-key }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # schedule / workflow_dispatch: the job-level `if` already
            # guaranteed TS_AUTHKEY is present.
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qx "hack/tsidp.Dockerfile"; then
            if [ "$HAS_KEY" != "true" ]; then
              echo "::error::hack/tsidp.Dockerfile (the tsidp version pin) changed in this PR, but the TS_AUTHKEY secret is not available, so the change CANNOT be e2e-tested. Untested tsidp bumps must not merge. Configure TS_AUTHKEY as an Actions secret (and as a Dependabot secret for Dependabot PRs) — see docs/COMPATIBILITY.md."
              exit 1
            fi
            echo "tsidp pin changed; running the full e2e loop"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "tsidp pin unchanged by this PR; nothing to e2e-test (fast success so the required check stays green)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        if: steps.gate.outputs.run == 'true'
      - name: Install kind
        if: steps.gate.outputs.run == 'true'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: Resolve tsidp image under test
        if: steps.gate.outputs.run == 'true'
        id: tsidp
        env:
          TSIDP_TAG_OVERRIDE: ${{ inputs.tsidp_tag }}
        run: |
          if [ -n "$TSIDP_TAG_OVERRIDE" ]; then
            echo "image=ghcr.io/tailscale/tsidp:${TSIDP_TAG_OVERRIDE}" >> "$GITHUB_OUTPUT"
          else
            echo "image=$(grep '^FROM' hack/tsidp.Dockerfile | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          fi
      - name: Run e2e loop
        if: steps.gate.outputs.run == 'true'
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TSIDP_IMAGE: ${{ steps.tsidp.outputs.image }}
        run: make e2e

  # NO-CREDENTIALS FALLBACK (always runs, including on forks where secrets
  # are unavailable): unit tests include a fake-tsidp contract suite that
  # exercises the operator's client against tsidp's HTTP API surface. It does
  # not prove the real binary still behaves — only e2e does that — but it
  # keeps every PR honest about the API contract we code against.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Unit + contract tests
        run: make test

  # Recording a passing pair (versions.yaml + chart pin) is deliberately a
  # human step with no stored credential: after a tsidp bump merges with a
  # green e2e, a maintainer runs `FORCE_TESTED_DATE=1 make sync-tsidp-version`
  # locally and commits the result. (A record-compat job with a repo PAT
  # used to live here; removed — the PAT was the riskiest credential in CI.)
